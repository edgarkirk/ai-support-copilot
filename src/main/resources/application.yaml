spring:
  application:
    name: ai-support-copilot

  datasource:
    url: jdbc:postgresql://localhost:5433/ai_support
    username: ai_support
    password: ai_support

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  ai:
    azure:
      openai:
        endpoint: ${AZURE_OPEN_AI_ENDPOINT}
        api-key: ${AZURE_OPEN_AI_KEY}
        chat:
          options:
            deployment-name: ${AZURE_OPEN_AI_DEPLOYMENT_NAME:gpt-4o}
        embedding:
          options:
            deployment-name: ${AZURE_OPEN_AI_EMBEDDING_DEPLOYMENT_NAME:text-embedding-3-small-1}